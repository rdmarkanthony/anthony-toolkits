<!-- source of src/assets/img/clouds/cloud-2.webp, the noise filter is too slow live, so it's saved as a 1400px webp -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
    <defs>
        <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="5" seed="21"/>
            <feDisplacementMap in="SourceGraphic" scale="100" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="6"/>
        </filter>
        <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="370">
            <stop offset="0.3" stop-color="#fff"/>
            <stop offset="1" stop-color="#c7d1df"/>
        </linearGradient>
        <radialGradient id="p">
            <stop offset="0.6" stop-color="#fff"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <g filter="url(#f)">
        <g fill="url(#g)">
            <ellipse cx="500" cy="310" rx="400" ry="60"/>
            <circle cx="180" cy="290" r="70"/>
            <circle cx="300" cy="250" r="105"/>
            <circle cx="450" cy="210" r="120"/>
            <circle cx="600" cy="240" r="100"/>
            <circle cx="730" cy="270" r="85"/>
            <circle cx="840" cy="300" r="55"/>
        </g>
        <g fill="url(#p)">
            <circle cx="420" cy="170" r="80"/>
            <circle cx="590" cy="200" r="60"/>
            <circle cx="290" cy="220" r="55"/>
        </g>
    </g>
</svg>
