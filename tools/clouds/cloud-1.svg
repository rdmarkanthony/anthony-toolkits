<!-- source of src/assets/img/clouds/cloud-1.webp, the noise filter is too slow live, so it's saved as a 1400px webp -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <defs>
        <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" seed="7"/>
            <feDisplacementMap in="SourceGraphic" scale="90" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="6"/>
        </filter>
        <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="440">
            <stop offset="0.35" stop-color="#fff"/>
            <stop offset="1" stop-color="#c7d1df"/>
        </linearGradient>
        <radialGradient id="p">
            <stop offset="0.6" stop-color="#fff"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <g filter="url(#f)">
        <g fill="url(#g)">
            <ellipse cx="400" cy="360" rx="300" ry="80"/>
            <circle cx="250" cy="310" r="100"/>
            <circle cx="380" cy="250" r="140"/>
            <circle cx="530" cy="290" r="110"/>
            <circle cx="620" cy="340" r="70"/>
            <circle cx="160" cy="355" r="60"/>
        </g>
        <g fill="url(#p)">
            <circle cx="350" cy="200" r="90"/>
            <circle cx="500" cy="240" r="70"/>
            <circle cx="240" cy="280" r="60"/>
        </g>
    </g>
</svg>
