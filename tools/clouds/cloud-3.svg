<!-- source of src/assets/img/clouds/cloud-3.webp, the noise filter is too slow live, so it's saved as a 1400px webp -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
    <defs>
        <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="5" seed="42"/>
            <feDisplacementMap in="SourceGraphic" scale="90" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="6"/>
        </filter>
        <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="540">
            <stop offset="0.4" stop-color="#fff"/>
            <stop offset="1" stop-color="#c7d1df"/>
        </linearGradient>
        <radialGradient id="p">
            <stop offset="0.6" stop-color="#fff"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <g filter="url(#f)">
        <g fill="url(#g)">
            <ellipse cx="350" cy="470" rx="250" ry="70"/>
            <circle cx="220" cy="410" r="100"/>
            <circle cx="340" cy="300" r="150"/>
            <circle cx="470" cy="390" r="110"/>
            <circle cx="300" cy="190" r="80"/>
            <circle cx="410" cy="210" r="90"/>
        </g>
        <g fill="url(#p)">
            <circle cx="330" cy="160" r="70"/>
            <circle cx="420" cy="260" r="80"/>
            <circle cx="250" cy="320" r="60"/>
        </g>
    </g>
</svg>
